- id: Q17
  question: 바우처로 결제된 배송 완료 주문들의 매출 합계는?
  level: L4
  trap: dup_join
  verified: true
  ordered: false
  gold_sql: SELECT ROUND(SUM(i.price), 2) FROM orders o JOIN order_items i ON o.order_id = i.order_id WHERE o.order_status = 'delivered' AND o.order_id IN (SELECT order_id FROM order_payments WHERE payment_type = 'voucher')
  expected:
    columns:
    - ROUND(SUM(i.price), 2)
    rows:
    - - 404020.72
  why: order_payments는 주문당 결제 행이 여러 개일 수 있음(1:N). 결제 테이블을 직접 조인하면 item 행이 결제 행 수만큼 복제돼 404,020.72 → 632,719.07로 부풂. IN 서브쿼리로 주문만 거르고 매출=delivered 주문의 SUM(price)
- id: Q18
  question: 2018년에 주문한 고객은 몇 명이야?
  level: L4
  trap: unique_id
  verified: true
  ordered: false
  gold_sql: SELECT COUNT(DISTINCT c.customer_unique_id) FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE strftime('%Y', o.order_purchase_timestamp) = '2018'
  expected:
    columns:
    - COUNT(DISTINCT c.customer_unique_id)
    rows:
    - - 52749
  why: customer_id는 주문마다 새로 발급됨. 사람 단위는 customer_unique_id. 2018년 COUNT(DISTINCT customer_unique_id)=52,749 vs customer_id=54,011
- id: Q19
  question: 2017년 매출은 얼마야?
  level: L4
  trap: biz_term
  verified: true
  ordered: false
  gold_sql: SELECT ROUND(SUM(i.price), 2) FROM orders o JOIN order_items i ON o.order_id = i.order_id WHERE o.order_status = 'delivered' AND strftime('%Y', o.order_purchase_timestamp) = '2017'
  expected:
    columns:
    - ROUND(SUM(i.price), 2)
    rows:
    - - 5962902.01
  why: 사내 정의 매출 = order_status='delivered' 주문의 SUM(order_items.price), 배송비 제외. 필터 없이 price만 6,155,806.98, price+freight 7,142,672.43, 정답 5,962,902.01
